# Public-safe serving contract example for the two large-model tiers.
# This is not a live-config mirror and is not directly deployable.
# Resolve placeholders only in the private deployment workflow.

models:
  "gpt-oss-120b":
    cmd: |
      <shared-runtime-root>/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m <model-root>/gpt-oss-120b/gpt-oss-120b-mxfp4-00001-of-00003.gguf
      -ngl 99 -ub 512 -c 65536 -np 1 --jinja -fa on
      --cache-ram 2048 -ctk f16 -ctv f16
    ttl: 1800
  "qwen35-122b-a10b":
    cmd: |
      <runtime-root>/releases/9a3bf2b84/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m <model-root>/qwen35-122b-a10b/Qwen3.5-122B-A10B-Q4_K_M-00001-of-00003.gguf
      -ngl 99 -ub 512 -c 32768 -np 1 --jinja -fa on
      --reasoning-format auto --reasoning off
      --cache-ram 2048 -ctk f16 -ctv f16
    ttl: 1800
