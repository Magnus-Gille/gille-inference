# Public-safe serving contract example for the large reasoning and release-day tiers.
# This is not a live-config mirror and is not directly deployable.
# Resolve placeholders only in the private deployment workflow.

models:
  "gpt-oss-120b":
    cmd: |
      <shared-runtime-root>/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m <model-root>/gpt-oss-120b/gpt-oss-120b-mxfp4-00001-of-00003.gguf
      -ngl 99 -ub 512 -c 65536 -np 1 --jinja -fa on
      --cache-ram 2048 -ctk f16 -ctv f16
    ttl: 1800
  "qwen38-27b":
    cmd: |
      <runtime-root>/releases/9b05354ec/bin/llama-server
      --host 127.0.0.1 --port ${PORT}
      -m <model-root>/qwen38-27b/Qwen3.8-27B-Q4_K_M.gguf
      -mm <model-root>/qwen38-27b/mmproj-Qwen3.8-27B-BF16.gguf
      --image-min-tokens 1024
      -ngl 999 -ub 512 -c 65536 -np 1 --jinja -fa on
      --spec-type draft-mtp --spec-draft-n-max 2
      --reasoning-format auto --reasoning auto
      --cache-ram 2048 -ctk q8_0 -ctv q8_0
    ttl: 1800
