# Public-reviewed additive drop-in for native ROCm System One models.
# Install only through an owner-approved M5 service rollout. The private
# llama-swap unit has DevicePolicy=closed and already allows renderD128;
# ROCm also needs the shared compute interface /dev/kfd. Keep the closed
# policy and existing render-node allow-list intact.
[Service]
DeviceAllow=/dev/kfd rw
