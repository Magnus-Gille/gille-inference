# Public-reviewed template; it is not installed by the repository or gateway deploy script.
# The private rollout installs it as the llama-swap service's memory.conf drop-in.
#
# The 2026-07-28 GPT-OSS/Qwen bake-off measured a 71.6 GiB peak cgroup in the
# Qwen 64K benchmark arm. Production Qwen remains bounded to 32K; the higher
# measurement is retained as the conservative resource basis. A 96 GiB ceiling
# therefore leaves measured model headroom while preserving at least 12 GiB for
# the host and independently pinned application services on the 128 GiB M5. The
# service and every child llama-server share this cgroup.
[Service]
MemoryMin=20G
MemoryMax=96G
MemorySwapMax=0
OOMPolicy=kill
OOMScoreAdjust=-700
ManagedOOMPreference=avoid
