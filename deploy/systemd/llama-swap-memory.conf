# Public-reviewed template; it is not installed by the repository or gateway deploy script.
# The private rollout installs it as the llama-swap service's memory.conf drop-in.
#
# The 2026-07-28 GPT-OSS/Qwen bake-off measured a 71.6 GiB peak cgroup in the
# Qwen 64K benchmark arm. Production Qwen remains bounded to 32K; the higher
# measurement is retained as the conservative resource basis. A 96 GiB ceiling
# therefore leaves measured model headroom while preserving at least 12 GiB for
# the host and independently pinned application services on the 128 GiB M5. The
# service and every child llama-server share this cgroup.
#
# MemoryMax does NOT contain the host: on this unified-memory machine GPU memory is
# taken from RAM but charged to no cgroup and to no process. A model start can
# therefore exhaust the host while this ceiling never fires (2026-10-01, issue #350).
#
# OOM victim order (issue #354). Because GPU memory is attributed to no process, the
# kernel chooses a victim by score alone. With a protective negative score here the
# model runtime was the last candidate: 16 unrelated near-zero-memory processes were
# killed and nothing was freed. The model runtime is the one process whose death
# frees the memory, so it must be the first candidate. The score is inherited by
# every child llama-server; the small proxy shares it and is restarted by systemd
# if an OOM continues after the model is gone.
# OOMPolicy=continue: only the killed process dies. The proxy keeps running, reports
# the failed start or request, and loads the model again on the next request.
# Accepted trade-off: a resident production model dies first in any host OOM.
[Service]
MemoryMin=20G
MemoryMax=96G
MemorySwapMax=0
OOMPolicy=continue
OOMScoreAdjust=900
ManagedOOMPreference=avoid
