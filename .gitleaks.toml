title = "Gille Inference secret scanning"

[extend]
useDefault = true

# A hermetic CI configuration test assembles this invented marker in a
# temporary untracked file. It guards against silently disabling scanning or
# replacing this config with an empty allowlist-only file; it cannot match a
# production credential format.
[[rules]]
id = "synthetic-config-test-secret"
description = "invented gitleaks configuration test marker"
regex = '''gitleaks-test-secret-[0-9a-f]{32}'''
secretGroup = 0

# The generic-api-key rule interprets the second '=' in this documented model
# ceiling as a credential assignment. It is a numeric model limit.
[[allowlists]]
description = "documented model-token ceiling"
condition = "AND"
regexTarget = "match"
paths = [
  '''^deploy/env\.example$''',
  '''^src/homeserver/README\.md$''',
]
regexes = ['''HOMESERVER_MODEL_MAX_TOKENS=vibethinker-3b=32768''']

# These property names are multiplied into local cost estimates; no value is
# present in source. The generic rule spans the preceding completionTokens arg.
[[allowlists]]
description = "local cost-estimator property names"
condition = "AND"
regexTarget = "match"
paths = ['''^src/homeserver/delegation-cost\.ts$''']
regexes = ['''opts\.m5(?:Marginal|Amortized)UsdPerMTok''']

# This fixed telemetry enum is not a credential; it distinguishes missing
# agent authentication from other M5 fallbacks. Keep the exception exact and
# scoped to its three enum declarations.
[[allowlists]]
description = "M5 adoption missing-auth fallback reason"
condition = "AND"
regexTarget = "match"
paths = [
  '''^client/m5-client\.mjs$''',
  '''^src/homeserver/mcp\.ts$''',
  '''^src/homeserver/adoption-evidence\.ts$''',
]
regexes = ['''m5_auth_unavailable''']

# Explicit fake keys used to prove redaction and CLI request behavior. Keep the
# exact literals and exact test paths narrow so a new token-shaped value fails.
[[allowlists]]
description = "code-loop redaction sentinel"
condition = "AND"
regexTarget = "match"
paths = ['''^tests/homeserver-code-loop-engine\.test\.ts$''']
regexes = ['''hs_owner_sekret999abc''']

[[allowlists]]
description = "CLI fake gateway key"
condition = "AND"
regexTarget = "match"
paths = ['''^tests/hs-cli\.test\.ts$''']
regexes = ['''hs_test123456789''']

[[allowlists]]
description = "deploy script test-only owner key"
condition = "AND"
regexTarget = "match"
paths = ['''^tests/deploy-gateway\.test\.ts$''']
regexes = ['''test-owner-key-0123456789''']

# This model identifier appears as a record key in synthetic harvest fixtures.
[[allowlists]]
description = "synthetic harvest model key"
condition = "AND"
regexTarget = "match"
paths = ['''^tests/post-harvest-decision-panel\.test\.ts$''']
regexes = ['''qwen3-30b-instruct''']
