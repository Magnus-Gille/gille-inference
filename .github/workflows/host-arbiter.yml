name: Fixed host arbitration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-arbiter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-arbiter:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and exercise ownership, crash and restoration invariants
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -pthread -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/launcher/arbiter.cpp native/launcher/test_arbiter.cpp -o "$RUNNER_TEMP/arbiter-tests"
          test "${GITHUB_ACTIONS:?}" = true
          test "${RUNNER_ENVIRONMENT:?}" = github-hosted
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            timeout 15 "$RUNNER_TEMP/arbiter-tests"
      - name: Prove restart cannot silently authorize a new owner
        run: |
          python3 native/launcher/test-arbiter-regression.py
