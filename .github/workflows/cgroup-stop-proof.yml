name: Bound cgroup stop proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cgroup-stop-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgroup-stop-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compile strict events parser and bound kernel reader
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/observer/cgroup_events.c native/observer/test_cgroup_events.c -o "$RUNNER_TEMP/cgroup-parser-tests"
          timeout 15 "$RUNNER_TEMP/cgroup-parser-tests"
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/observer/cgroup_events.c native/launcher/cgroup_state.c native/tests/cgroup_state_fixture.c \
            -o "$RUNNER_TEMP/cgroup-state-fixture"
      - name: Verify real descendant population and empty subtree after owned kill
        run: |
          test "${GITHUB_ACTIONS:?}" = true
          test "${RUNNER_ENVIRONMENT:?}" = github-hosted
          sudo -n env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin "GITHUB_ACTIONS=$GITHUB_ACTIONS" "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            timeout 15 "$RUNNER_TEMP/cgroup-state-fixture"
      - name: Prove a filesystem imitation cannot supply kernel evidence
        run: |
          python3 native/tests/test-cgroup-state-regression.py
